[project]
name = "fraud-lifecycle"
version = "0.1.0"
description = "Fraud detection lifecycle on IEEE-CIS: cost-based decisions, label-free drift monitoring, retraining policies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.7",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "mlflow>=3.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
    "nbconvert>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
